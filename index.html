<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AVL Dashboard Pro</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --side-panel: #141820;
            --accent: #00d2ff;
            --node-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --text: #e0e6ed;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Design */
        aside {
            width: 300px;
            background-color: var(--side-panel);
            border-right: 1px solid var(--border);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
            z-index: 5;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 50px;
            background: var(--node-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-wrapper {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #6a768a;
            margin-bottom: 10px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            border: none;
        }

        .btn-primary {
            background: var(--node-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(58, 123, 213, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(58, 123, 213, 0.6);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #ff4b2b;
            color: #ff4b2b;
        }

        .btn-outline:hover {
            background: #ff4b2b;
            color: white;
        }

        /* Visualization Area */
        main {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at 50% 50%, #1c2331 0%, #0b0e14 100%);
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<aside>
    <div class="brand">AVL.Visualizer</div>
    
    <div class="input-wrapper">
        <label>Node Value</label>
        <input type="number" id="nodeVal" placeholder="Enter integer..." autocomplete="off">
    </div>

    <div class="btn-stack">
        <button class="btn-primary" onclick="handleAdd()">Insert Node</button>
        <button class="btn-outline" onclick="handleReset()">Clear Tree</button>
    </div>
</aside>

<main id="mainContainer">
    <canvas id="treeCanvas"></canvas>
</main>

<script>
    class Node {
        constructor(v) {
            this.v = v;
            this.l = null;
            this.r = null;
            this.h = 1;
        }
    }

    class AVL {
        getH(n) { return n ? n.h : 0; }
        getB(n) { return n ? this.getH(n.l) - this.getH(n.r) : 0; }
        
        rotR(y) {
            let x = y.l; let t = x.r;
            x.r = y; y.l = t;
            y.h = Math.max(this.getH(y.l), this.getH(y.r)) + 1;
            x.h = Math.max(this.getH(x.l), this.getH(x.r)) + 1;
            return x;
        }

        rotL(x) {
            let y = x.r; let t = y.l;
            y.l = x; x.r = t;
            x.h = Math.max(this.getH(x.l), this.getH(x.r)) + 1;
            y.h = Math.max(this.getH(y.l), this.getH(y.r)) + 1;
            return y;
        }

        add(n, v) {
            if (!n) return new Node(v);
            if (v < n.v) n.l = this.add(n.l, v);
            else if (v > n.v) n.r = this.add(n.r, v);
            else return n;

            n.h = 1 + Math.max(this.getH(n.l), this.getH(n.r));
            let b = this.getB(n);

            if (b > 1 && v < n.l.v) return this.rotR(n);
            if (b < -1 && v > n.r.v) return this.rotL(n);
            if (b > 1 && v > n.l.v) { n.l = this.rotL(n.l); return this.rotR(n); }
            if (b < -1 && v < n.r.v) { n.r = this.rotR(n.r); return this.rotL(n); }
            return n;
        }
    }

    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const logic = new AVL();
    let root = null;

    function handleAdd() {
        const el = document.getElementById('nodeVal');
        const v = parseInt(el.value);
        if (isNaN(v)) return;
        root = logic.add(root, v);
        el.value = '';
        render();
    }

    function handleReset() {
        root = null;
        render();
    }

    function render() {
        canvas.width = document.getElementById('mainContainer').clientWidth;
        canvas.height = document.getElementById('mainContainer').clientHeight;
        if (root) draw(root, canvas.width / 2, 80, canvas.width / 4);
    }

    function draw(n, x, y, sep) {
        if (n.l) {
            line(x, y, x - sep, y + 90);
            draw(n.l, x - sep, y + 90, sep / 1.9);
        }
        if (n.r) {
            line(x, y, x + sep, y + 90);
            draw(n.r, x + sep, y + 90, sep / 1.9);
        }

        // Draw Node
        const g = ctx.createLinearGradient(x-20, y-20, x+20, y+20);
        g.addColorStop(0, '#00d2ff');
        g.addColorStop(1, '#3a7bd5');

        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(0, 210, 255, 0.3)';
        ctx.beginPath();
        ctx.arc(x, y, 24, 0, 7);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "white";
        ctx.font = "600 15px Inter, system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(n.v, x, y);
    }

    function line(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    window.addEventListener('resize', render);
    render();
</script>
</body>
</html>
