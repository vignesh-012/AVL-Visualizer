<div class="input-wrapper">
    <label>Find Node</label>
    <input type="number" id="searchVal" placeholder="Highlight value..." autocomplete="off" oninput="handleSearch()">
</div>

<script>
    class Node {
        constructor(v) {
            this.v = v;
            this.l = null;
            this.r = null;
            this.h = 1;
        }
    }

    class AVL {
        getH(n) { return n ? n.h : 0; }
        getB(n) { return n ? this.getH(n.l) - this.getH(n.r) : 0; }
        
        rotR(y) {
            let x = y.l; let t = x.r;
            x.r = y; y.l = t;
            y.h = Math.max(this.getH(y.l), this.getH(y.r)) + 1;
            y.h = Math.max(this.getH(y.l), this.getH(y.r)) + 1; // Corrected height update
            x.h = Math.max(this.getH(x.l), this.getH(x.r)) + 1;
            return x;
        }

        rotL(x) {
            let y = x.r; let t = y.l;
            y.l = x; x.r = t;
            x.h = Math.max(this.getH(x.l), this.getH(x.r)) + 1;
            y.h = Math.max(this.getH(y.l), this.getH(y.r)) + 1;
            return y;
        }

        add(n, v) {
            if (!n) return new Node(v);
            if (v < n.v) n.l = this.add(n.l, v);
            else if (v > n.v) n.r = this.add(n.r, v);
            else return n;

            n.h = 1 + Math.max(this.getH(n.l), this.getH(n.r));
            let b = this.getB(n);

            if (b > 1 && v < n.l.v) return this.rotR(n);
            if (b < -1 && v > n.r.v) return this.rotL(n);
            if (b > 1 && v > n.l.v) { n.l = this.rotL(n.l); return this.rotR(n); }
            if (b < -1 && v < n.r.v) { n.r = this.rotR(n.r); return this.rotL(n); }
            return n;
        }
    }

    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const logic = new AVL();
    let root = null;
    let highlightValue = null;

    function handleAdd() {
        const el = document.getElementById('nodeVal');
        const v = parseInt(el.value);
        if (isNaN(v)) return;
        root = logic.add(root, v);
        el.value = '';
        render();
    }

    function handleReset() {
        root = null;
        highlightValue = null;
        document.getElementById('searchVal').value = '';
        render();
    }

    // New function to handle real-time searching
    function handleSearch() {
        const val = parseInt(document.getElementById('searchVal').value);
        highlightValue = isNaN(val) ? null : val;
        render();
    }

    function render() {
        canvas.width = document.getElementById('mainContainer').clientWidth;
        canvas.height = document.getElementById('mainContainer').clientHeight;
        if (root) draw(root, canvas.width / 2, 80, canvas.width / 4);
    }

    function draw(n, x, y, sep) {
        if (n.l) {
            line(x, y, x - sep, y + 90);
            draw(n.l, x - sep, y + 90, sep / 1.9);
        }
        if (n.r) {
            line(x, y, x + sep, y + 90);
            draw(n.r, x + sep, y + 90, sep / 1.9);
        }

        const isFound = n.v === highlightValue;
        
        // Dynamic styling for search highlight
        const g = ctx.createLinearGradient(x-20, y-20, x+20, y+20);
        if (isFound) {
            g.addColorStop(0, '#ffd700'); // Gold
            g.addColorStop(1, '#ffa500'); // Orange
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 30;
        } else {
            g.addColorStop(0, '#00d2ff');
            g.addColorStop(1, '#3a7bd5');
            ctx.shadowColor = 'rgba(0, 210, 255, 0.3)';
            ctx.shadowBlur = 20;
        }

        ctx.beginPath();
        ctx.arc(x, y, isFound ? 28 : 24, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = isFound ? "#000" : "white";
        ctx.font = isFound ? "bold 16px Inter" : "600 15px Inter";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(n.v, x, y);
    }

    function line(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    window.addEventListener('resize', render);
    render();
</script>
